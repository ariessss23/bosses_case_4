# Схемы событий ситуационного центра — кейс 4
# Не REST API, а JSON-схемы входа (от датчиков и приложения)
# Проверить на https://www.jsonschemavalidator.net/

$schema: "https://json-schema.org/draft/2020-12/schema"
title: SituationCenterEvents
description: Набор схем событий для ситуационного центра

definitions:

  # ОБРАЗЕЦ — не трогать
  TelemetryEvent:
    type: object
    required: [event_id, time, location, indicator, value]
    additionalProperties: false
    properties:
      event_id:
        type: string
        pattern: '^evt_[A-Za-z0-9]{6,32}$'
      time:
        type: string
        format: date-time
      location:
        type: string
        pattern: '^site_[0-9]{2}$'
      indicator:
        enum: [temperature, humidity, ventilation]
      value:
        type: number
      signature:
        type: string
        description: HMAC-SHA256 подпись события (защита от подмены)

  # Заполнено
  IncidentEvent:
    type: object
    required: [incident_id, type, location, time, status]
    properties:
      incident_id:
        type: string
        pattern: '^inc_[0-9]{3}$'
      type:
        enum: [temperature, ventilation, humidity, equipment, other]
      location:
        type: string
        pattern: '^site_[0-9]{2}$'
      time:
        type: string
        format: date-time
      responsible:
        type: [string, "null"]
      status:
        enum: [NEW, ASSIGNED, IN_PROGRESS, CLOSED]
      source:
        enum: [mobile, sensor, auto]

  # Заполнено
  AlertEvent:
    type: object
    required: [alert_id, severity, at]
    properties:
      alert_id:
        type: string
        pattern: '^alrt_[0-9]{4}$'
      measurement_id:
        type: string
      severity:
        enum: [WARNING, CRITICAL, STALE]
      action:
        enum: [ALERT_CREATED, ESCALATED, DUPLICATE]
      at:
        type: string
        format: date-time

  # Заполнено
  TransitionRequest:
    type: object
    required: [incident_id, to, actor]
    properties:
      incident_id:
        type: string
      to:
        enum: [ASSIGNED, IN_PROGRESS, CLOSED]
      actor:
        type: string
      comment:
        type: [string, "null"]

  # Заполнено
  Error:
    type: object
    required: [error_code, message]
    properties:
      error_code:
        enum: [VALIDATION_ERROR, UNKNOWN_LOCATION, INVALID_TRANSITION, DUPLICATE_EVENT, SENSOR_SIGNATURE_INVALID]
      message:
        type: string
      retryable:
        type: boolean
      details:
        type: object

examples:

  valid_telemetry:
    event_id: evt_ab12cd
    time: "2025-11-01T08:00:00Z"
    location: site_01
    indicator: temperature
    value: 28.3
    signature: "hmac:..."

  valid_incident:
    incident_id: inc_001
    type: temperature
    location: site_01
    time: "2025-11-01T08:00:00Z"
    responsible: null
    status: NEW
    source: sensor

  invalid_location:
    incident_id: inc_999
    type: temperature
    location: site_99       # не из sites.csv
    time: "2025-11-01T08:00:00Z"
    status: NEW

  invalid_transition:
    incident_id: inc_001
    to: CLOSED               # напрямую из NEW нельзя
    actor: e_101